services:
  services:

    app:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: sas-hrm-app
      restart: unless-stopped
      working_dir: /var/www
      volumes:
        - .:/var/www
      depends_on:
        - db
      networks:
        - sas-hrm-network

    nginx:
      image: nginx:alpine
      container_name: sas-hrm-nginx
      restart: unless-stopped
      ports:
        - "8000:80"
      volumes:
        - .:/var/www
        - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - app
      networks:
        - sas-hrm-network

    db:
      image: mysql:8.0
      container_name: sas-hrm-db
      restart: unless-stopped
      environment:
        MYSQL_DATABASE: sas_hrm
        MYSQL_ROOT_PASSWORD: root_secret_change_me
        MYSQL_USER: sas_hrm_user
        MYSQL_PASSWORD: sas_hrm_password_change_me
      ports:
        - "3307:3306"
      volumes:
        - mysql_data:/var/lib/mysql
      networks:
        - sas-hrm-network

  networks:
    sas-hrm-network:
      driver: bridge

  volumes:
    mysql_data:
